services:
  postgres-db:
    image: postgres:16-alpine
    container_name: daviweb-postgres

    environment:
      POSTGRES_DB: daviweb_db
      POSTGRES_USER: daviweb_user
      POSTGRES_PASSWORD: daviweb_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
volumes:
  postgres_data: