openapi: 3.1.0
info:
  title: DaviWeb API
  description: "REST API of DaviWeb, a booking and management app for hair salons."
  version: v1
servers:
- url: /
  description: Same origin as the API
tags:
- name: Services
  description: Catalog of services offered by the salon
paths:
  /api/v1/services:
    get:
      tags:
      - Services
      summary: List services
      description: Returns a page of services. Use the page and size query parameters
        to paginate; the default page size is 10.
      operationId: findAll
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelSalonService"
components:
  schemas:
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
      required:
      - number
      - size
      - totalElements
      - totalPages
    PagedModelSalonService:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/SalonService"
        page:
          $ref: "#/components/schemas/PageMetadata"
      required:
      - content
      - page
    SalonService:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        basePrice:
          type: number
