name: daviweb
services:
  postgres:
    image: postgres:16-alpine
    container_name: daviweb-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-daviweb_db}
      POSTGRES_USER: ${DB_USERNAME:-daviweb_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-daviweb_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: